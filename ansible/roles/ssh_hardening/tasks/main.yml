- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
  notify: Restart ssh


- name: Ensure ssh service is running
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: yes
    